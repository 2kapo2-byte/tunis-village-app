name: Flutter CI & Release QA

on:
  push:
    branches:
      - refactor/two-app-architecture
      - main
  pull_request:
    branches:
      - refactor/two-app-architecture
      - main
  workflow_dispatch:

jobs:
  customer-app:
    name: Customer App - Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Customer lib
        run: flutter analyze lib --no-fatal-infos
      - name: Test Customer App
        run: flutter test test

  partner-app:
    name: Partner App - Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: partner_app
        run: flutter pub get
      - name: Analyze Partner App
        working-directory: partner_app
        run: flutter analyze
      - name: Test Partner App
        working-directory: partner_app
        run: flutter test

  shared-core:
    name: Shared Core - Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: packages/tunis_village_core
        run: dart pub get
      - name: Analyze Shared Core
        working-directory: packages/tunis_village_core
        run: dart analyze
      - name: Test Shared Core
        working-directory: packages/tunis_village_core
        run: dart test

  customer-release:
    name: Customer Android Release Build
    runs-on: ubuntu-latest
    needs: [customer-app, shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files for customer app
        run: flutter create --platforms=android --project-name tunis_village_customer .
      - run: flutter pub get
      - name: Build Customer APK
        run: flutter build apk --release
      - name: Verify Customer APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tunis-village-customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  partner-release:
    name: Partner Android Release Build
    runs-on: ubuntu-latest
    needs: [partner-app, shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files for partner app
        working-directory: partner_app
        run: flutter create --platforms=android --project-name tunis_village_partner .
      - name: Get dependencies
        working-directory: partner_app
        run: flutter pub get
      - name: Build Partner APK
        working-directory: partner_app
        run: flutter build apk --release
      - name: Verify Partner APK
        run: test -s partner_app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tunis-village-partner-apk
          path: partner_app/build/app/outputs/flutter-apk/app-release.apk
