name: Flutter CI & Release QA

on:
  push:
    branches:
      - refactor/two-app-architecture
      - main
  pull_request:
    branches:
      - refactor/two-app-architecture
      - main
  workflow_dispatch:

jobs:
  config-security:
    name: Public Config & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public configuration and secret hygiene
        run: bash tool/check_public_config.sh

  release-signing-preflight:
    name: Release Signing Security Preflight
    runs-on: ubuntu-latest
    needs: [config-security]
    steps:
      - uses: actions/checkout@v4
      - name: Verify signing material is not committed
        run: bash tool/check_release_signing_preflight.sh

  customer-app:
    name: Customer App - Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Customer lib
        run: flutter analyze lib --no-fatal-infos
      - name: Test Customer App
        run: flutter test test

  partner-app:
    name: Partner App - Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: partner_app
        run: flutter pub get
      - name: Analyze Partner App
        working-directory: partner_app
        run: flutter analyze
      - name: Test Partner App
        working-directory: partner_app
        run: flutter test

  shared-core:
    name: Shared Core - Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: packages/tunis_village_core
        run: dart pub get
      - name: Analyze Shared Core
        working-directory: packages/tunis_village_core
        run: dart analyze
      - name: Test Shared Core
        working-directory: packages/tunis_village_core
        run: dart test

  customer-release:
    name: Customer Android Release Build
    runs-on: ubuntu-latest
    needs: [config-security, customer-app, shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Remove incomplete legacy Android platform
        run: rm -rf android
      - name: Generate clean Android platform
        run: flutter create --platforms=android --project-name tunis_village_customer .
      - run: flutter pub get
      - name: Build Customer APK
        run: flutter build apk --release
      - name: Verify Customer APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tunis-village-customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  partner-release:
    name: Partner Android Release Build
    runs-on: ubuntu-latest
    needs: [config-security, partner-app, shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate clean Android platform
        working-directory: partner_app
        run: flutter create --platforms=android --project-name tunis_village_partner .
      - name: Get dependencies
        working-directory: partner_app
        run: flutter pub get
      - name: Build Partner APK
        working-directory: partner_app
        run: flutter build apk --release
      - name: Verify Partner APK
        working-directory: partner_app
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tunis-village-partner-apk
          path: partner_app/build/app/outputs/flutter-apk/app-release.apk

  ios-platform-validation:
    name: iOS Platform Validation
    runs-on: macos-latest
    needs: [config-security, customer-app, partner-app, shared-core]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Customer iOS platform
        run: flutter create --platforms=ios --project-name tunis_village_customer .
      - name: Set Customer bundle identifier
        run: |
          find ios -name project.pbxproj -print0 | xargs -0 sed -i '' 's/com.example.tunisVillage/com.tunisvillage.customer/g; s/com.example.tunis_village_customer/com.tunisvillage.customer/g'
      - name: Validate Customer iOS build without signing
        run: flutter build ios --release --no-codesign
      - name: Generate Partner iOS platform
        working-directory: partner_app
        run: flutter create --platforms=ios --project-name tunis_village_partner .
      - name: Set Partner bundle identifier
        working-directory: partner_app
        run: |
          find ios -name project.pbxproj -print0 | xargs -0 sed -i '' 's/com.example.tunisVillage/com.tunisvillage.partner/g; s/com.example.tunis_village_partner/com.tunisvillage.partner/g'
      - name: Validate Partner iOS build without signing
        working-directory: partner_app
        run: flutter build ios --release --no-codesign
