name: Bootstrap Flutter Platforms

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
      - run: chmod +x tool/bootstrap_platforms.sh && ./tool/bootstrap_platforms.sh
      - name: Commit generated Android platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          if git diff --cached --quiet; then
            echo "Native platform scaffolding already present."
            exit 0
          fi
          git commit -m "chore: add Flutter Android and iOS platform scaffolding"
          git push
