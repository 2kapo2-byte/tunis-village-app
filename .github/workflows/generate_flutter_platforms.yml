name: Generate Flutter Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
      - name: Generate missing or incomplete Flutter platforms
        run: |
          set -euo pipefail
          chmod +x tool/bootstrap_platforms.sh
          ./tool/bootstrap_platforms.sh
      - name: Commit generated platform files
        run: |
          set -euo pipefail
          if git diff --quiet && git status --porcelain | grep -q '^??'; then
            echo "Unexpected untracked-only state; continuing with explicit add."
          fi
          if git status --porcelain | grep -qE '^(\?\?| M|M ) (android|ios)(/|$)'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f android ios
            git commit -m "chore: generate Flutter Android and iOS platforms"
            git push
          else
            echo "No Android/iOS platform changes required."
          fi
