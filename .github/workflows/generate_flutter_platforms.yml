name: Generate Flutter Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
      - name: Generate missing Flutter platform projects
        run: |
          set -e
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android,ios --org com.tunisvillage --project-name tunis_village_app .
          elif [ ! -d ios ]; then
            flutter create --platforms=ios --org com.tunisvillage --project-name tunis_village_app .
          fi
      - name: Commit generated platform files
        run: |
          if git diff --quiet; then
            echo "No platform changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios
          git commit -m "chore: generate Flutter Android and iOS platforms"
          git push
